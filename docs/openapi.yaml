openapi: 3.0.3
info:
  title: Sisencodigital Backend API
  version: 1.0.0
  description: Authentication API for the Sisencodigital backend.
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: API availability
  - name: Authentication
    description: Registration, login, logout, and current-user endpoints

paths:
  /:
    get:
      tags:
        - Health
      summary: Check API availability
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: API is running

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a team member
      description: Public registration always creates a TEAM_MEMBER account. It cannot create an ADMIN account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: John Doe
              email: john@example.com
              password: password123
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registration successful
                user:
                  id: 2
                  name: John Doe
                  email: john@example.com
                  role: TEAM_MEMBER
                  createdAt: '2026-09-06T12:00:00.000Z'
        '400':
          description: Missing required fields or password is shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingFields:
                  value:
                    message: Name, email and password are required
                shortPassword:
                  value:
                    message: Password must be at least 8 characters
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Email is already registered
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Verifies credentials and sets an HttpOnly token cookie. The token is not returned in the JSON response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: admin@123
      responses:
        '200':
          description: Login successful. A token cookie is set for the client.
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie. Browsers store and resend it automatically.
              schema:
                type: string
                example: token=eyJ...; Max-Age=86400; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login successful
                user:
                  id: 1
                  name: admin123
                  email: admin@example.com
                  role: ADMIN
        '400':
          description: Email or password is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Email and password are required
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Invalid email or password
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Requires the token cookie and clears it. Do not send a Bearer Authorization header.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful. The token cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired token cookie returned by the server.
              schema:
                type: string
                example: token=; Max-Age=0; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logout successful
        '401':
          $ref: '#/components/responses/AuthenticationRequired'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user
      description: Reads the HttpOnly token cookie, verifies it, and returns fresh user data from the database.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              example:
                user:
                  id: 1
                  name: admin123
                  email: admin@example.com
                  role: ADMIN
                  createdAt: '2026-09-06T12:00:00.000Z'
        '401':
          description: Missing, invalid, expired, or no-longer-valid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                missingCookie:
                  value:
                    message: Authentication required
                invalidCookie:
                  value:
                    message: Invalid or expired token
                deletedUser:
                  value:
                    message: User no longer exists

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HttpOnly cookie set by POST /api/auth/login. Enable cookie handling in the client; do not use a Bearer token.

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: admin@123

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: admin123
        email:
          type: string
          format: email
          example: admin@example.com
        role:
          type: string
          enum:
            - TEAM_MEMBER
            - ADMIN
          example: ADMIN
        createdAt:
          type: string
          format: date-time
          example: '2026-09-06T12:00:00.000Z'

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: API is running

    RegisterResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Registration successful
        user:
          $ref: '#/components/schemas/User'

    LoginResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Login successful
        user:
          $ref: '#/components/schemas/User'

    CurrentUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

  responses:
    AuthenticationRequired:
      description: Authentication cookie is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            missingCookie:
              value:
                message: Authentication required
            invalidCookie:
              value:
                message: Invalid or expired token

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Internal server error
